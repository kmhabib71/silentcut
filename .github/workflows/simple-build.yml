name: Simple Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install system dependencies
        run: |
          # Install Visual C++ redistributable for PyQt5 with robust error handling
          echo "🔧 Installing Visual C++ Redistributable..."

          # Try Chocolatey first
          $chocoSuccess = $false
          try {
            echo "📦 Attempting Chocolatey installation..."
            choco source add -n=chocolatey -s=https://community.chocolatey.org/api/v2/ --force
            choco install vcredist2019 -y --force
            
            if ($LASTEXITCODE -eq 0) {
              echo "✅ Chocolatey installation successful"
              $chocoSuccess = $true
            }
          } catch {
            echo "⚠️ Chocolatey installation failed: $($_.Exception.Message)"
          }

          # If Chocolatey failed, use direct download
          if (-not $chocoSuccess) {
            try {
              echo "🌐 Downloading Visual C++ Redistributable from Microsoft..."
              Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
              
              echo "⚙️ Installing Visual C++ Redistributable..."
              $process = Start-Process -FilePath "vc_redist.x64.exe" -ArgumentList '/quiet', '/norestart' -Wait -PassThru
              $exitCode = $process.ExitCode
              
              # Handle all normal exit codes for Visual C++ Redistributable
              switch ($exitCode) {
                0 { echo "✅ Installation completed successfully" }
                1 { echo "✅ Already installed or newer version exists" }
                1638 { echo "✅ Another version already installed" }
                3010 { echo "✅ Installation successful (reboot recommended)" }
                1641 { echo "✅ Installation successful (reboot initiated)" }
                default { 
                  echo "⚠️ Installation completed with exit code $exitCode"
                  echo "   This is likely not critical for the build process"
                }
              }
              
              # Clean up
              Remove-Item "vc_redist.x64.exe" -ErrorAction SilentlyContinue
              
            } catch {
              echo "⚠️ Direct installation failed: $($_.Exception.Message)"
              echo "   Continuing build - Visual C++ may already be available"
            }
          }

          # Verify Visual C++ Redistributable installation
          echo "🔍 Verifying Visual C++ Redistributable installation..."
          try {
            $vcRedistCheck = reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64" /v Version 2>$null
            if ($LASTEXITCODE -eq 0) {
              echo "✅ Visual C++ 2015 Redistributable verified"
            } else {
              $vcRedistCheck = reg query "HKLM\SOFTWARE\Microsoft\VisualStudio\VC\Runtimes\x64" /v Version 2>$null
              if ($LASTEXITCODE -eq 0) {
                echo "✅ Visual C++ Redistributable verified"
              } else {
                echo "⚠️ Visual C++ Redistributable registry entry not found"
                echo "   This may not affect the build if runtime is available"
              }
            }
          } catch {
            echo "⚠️ Could not verify Visual C++ installation, but continuing build"
          }

          echo "✅ System dependencies setup completed successfully"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nuitka

      - name: Test imports
        run: |
          python -c "import PyQt5.QtWidgets; print('✓ PyQt5 working')"
          python -c "import moviepy.editor; print('✓ MoviePy working')"
          python -c "import cv2; print('✓ OpenCV working')"
          python -c "import numpy; print('✓ NumPy working')"
          python -c "import sys; print(f'Python version: {sys.version}')"

      - name: Quick PyInstaller Test
        continue-on-error: true
        run: |
          pyinstaller --onefile --name="SilentCutTest" --windowed silence_cutter.py
          if (Test-Path "dist/SilentCutTest.exe") {
            echo "✓ PyInstaller build successful"
            $size = (Get-Item "dist/SilentCutTest.exe").Length
            echo "Executable size: $([math]::Round($size/1MB, 2)) MB"
          } else {
            echo "✗ PyInstaller build failed"
          }

      - name: Upload test executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: dist/SilentCutTest.exe
          retention-days: 7
