name: Simple Build Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

jobs:
  test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install system dependencies
        run: |
          # Refresh Chocolatey sources and install Visual C++ redistributable for PyQt5
          try {
            echo "Refreshing Chocolatey sources..."
            choco source add -n=chocolatey -s=https://community.chocolatey.org/api/v2/ --force
            
            echo "Attempting to install Visual C++ Redistributable via Chocolatey..."
            choco install vcredist2019 -y --force --pre
            
            if ($LASTEXITCODE -eq 0) {
              echo "✅ Successfully installed Visual C++ Redistributable via Chocolatey"
            } else {
              throw "Chocolatey installation failed"
            }
          } catch {
            echo "⚠️ Chocolatey installation failed. Using direct download fallback..."
            
            # Fallback: Direct download and installation
            echo "Downloading Visual C++ Redistributable directly from Microsoft..."
            Invoke-WebRequest -Uri "https://aka.ms/vs/16/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
            
            echo "Installing Visual C++ Redistributable..."
            Start-Process -FilePath "vc_redist.x64.exe" -ArgumentList '/quiet', '/norestart' -Wait -PassThru
            
            if ($LASTEXITCODE -eq 0 -or $LASTEXITCODE -eq 3010) {
              echo "✅ Successfully installed Visual C++ Redistributable via direct download"
            } else {
              echo "⚠️ Visual C++ installation completed with exit code: $LASTEXITCODE"
            }
            
            # Clean up
            Remove-Item "vc_redist.x64.exe" -ErrorAction SilentlyContinue
          }

          echo "System dependencies installation completed"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller nuitka

      - name: Test imports
        run: |
          python -c "import PyQt5.QtWidgets; print('✓ PyQt5 working')"
          python -c "import moviepy.editor; print('✓ MoviePy working')"
          python -c "import cv2; print('✓ OpenCV working')"
          python -c "import numpy; print('✓ NumPy working')"
          python -c "import sys; print(f'Python version: {sys.version}')"

      - name: Quick PyInstaller Test
        continue-on-error: true
        run: |
          pyinstaller --onefile --name="SilentCutTest" --windowed silence_cutter.py
          if (Test-Path "dist/SilentCutTest.exe") {
            echo "✓ PyInstaller build successful"
            $size = (Get-Item "dist/SilentCutTest.exe").Length
            echo "Executable size: $([math]::Round($size/1MB, 2)) MB"
          } else {
            echo "✗ PyInstaller build failed"
          }

      - name: Upload test executable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: dist/SilentCutTest.exe
          retention-days: 7
